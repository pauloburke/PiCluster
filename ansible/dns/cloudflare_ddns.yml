---
- name: Update Cloudflare Dynamic DNS
  hosts: localhost
  gather_facts: no

  vars:
    zone_id: "{{ lookup('env', 'ZONE_ID') }}"
    cloudflare_api_token: "{{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}"

  tasks:
    - name: Update DNS records via Cloudflare API
      uri:
        url: "https://api.cloudflare.com/client/v4/zones/{{ zone_id }}/dns_records/scan"
        method: POST
        headers:
          Content-Type: "application/json"
          X-Auth-Key: "{{ cloudflare_api_key }}"
        body: "{}"
        status_code: 200
        return_content: yes
      register: result

    - name: Debug response from Cloudflare
      debug:
        var: result.content

