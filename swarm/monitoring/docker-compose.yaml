  #       limits:
  #         memory: 128M
  #       reservations:
  #         memory: 64M
  #   volumes:
  #     - type: bind
  #       source: /
  #       target: /rootfs
  #       read_only: true
  #     - type: bind
  #       source: /proc
  #       target: /host/proc
