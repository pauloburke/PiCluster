volumes:
  grafana-data:
  prometheus-data:

networks:
  monitoring:
    driver: overlay
  traefik-public:
    external: true

secrets:
  grafana_password:
    external: true
  grafana_authentik_client_id:
    external: true
  grafana_authentik_client_secret:
    external: true

configs:
  prometheus-config:
    external: true


