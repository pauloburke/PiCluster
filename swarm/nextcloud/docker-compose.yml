services:

  db:
    image: mariadb:10.11
    restart: always
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    volumes:
      - db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=mysql
      - MYSQL_PASSWORD=mysql
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.rpi-model == 5

  redis:
    image: redis:alpine
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.rpi-model == 5
    
  app:
    image: nextcloud
    user: 1000:1000
    depends_on:
      - redis
      - db
    volumes:
      - nextcloud-nfs:/var/www/html
    environment:
      - MYSQL_PASSWORD=mysql
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_HOST=db
    networks:
      - traefik-public
      - default
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.rpi-model == 5
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.nextcloud.rule=Host(`nextcloud.burke-pi.org`)"
        - "traefik.http.routers.nextcloud.tls.certresolver=cloudflare"
        - "traefik.http.routers.nextcloud.tls=true"
        - "traefik.http.routers.nextcloud.entrypoints=websecure"
        - "traefik.http.services.nextcloud.loadbalancer.server.port=80"


volumes:
  nextcloud-nfs:
    driver_opts:
      type: "nfs"
      o: "addr=192.168.50.5,nfsvers=4"
      device: ":/picluster-nextcloud"
  db:

networks:
  traefik-public:
    external: true
