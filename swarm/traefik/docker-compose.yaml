---

version: '3.8'

services:
  traefik:
    image: traefik:v3.2
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - traefik-public
    configs:
      - source: traefik-config
        target: /etc/traefik/traefik.yaml
        mode: 0444
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager

configs:
  traefik-config:
    external: true

networks:
  traefik-public:
    external: true
