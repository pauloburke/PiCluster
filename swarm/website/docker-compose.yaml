version: '3.8'
  
services:
  personal-website:
    image: nginx:latest
    ports:
      - 81:81
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.personal-website.rule=Host(`paulo.burke-pi.org`)"
        - "traefik.http.routers.personal-website.tls=true"
        - "traefik.http.routers.personal-website.tls.certresolver=cloudflare"
        - "traefik.http.routers.personal-website.tls.domains[0].main=burke-pi.org"
        - "traefik.http.routers.personal-website.tls.domains[0].sans=*.burke-pi.org"
        - "traefik.http.routers.personal-website.entrypoints=websecure"
        - "traefik.http.services.personal-website.loadbalancer.server.port=81"
    networks:
      - traefik-public
    configs:
      - source: personal-website-config
        target: /etc/nginx/conf.d/default.conf
        mode: 0444
    volumes:
      - /scratch/websites/pauloburke.github.io:/usr/share/nginx/html

networks:
  traefik-public:
    external: true

configs:
  personal-website-config:
    external: true
